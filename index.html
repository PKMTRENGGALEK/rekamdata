<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INOVASI AGEN KRIBO - Puskesmas Trenggalek</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous"
  />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Flatpickr -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- Select2 -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@ttskch/select2-bootstrap4-theme@1.5.2/dist/select2-bootstrap4.min.css" rel="stylesheet" />

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* ===== ROOT VARIABLES ===== */
    :root {
      --primary: #0f766e;
      --secondary: #14b8a6;
      --accent: #fbbf24;
      --dark: #064e3b;
      --light: #f0fdfa;
      --gray: #64748b;
    }

    /* ===== BODY ===== */
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #ecfdf5 50%, #f0fdfa 100%);
      min-height: 100vh;
      position: relative;
    }

    /* ===== DECORATIVE BACKGROUND PATTERN ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%230f766e' fill-opacity='0.03'%3E%3Ccircle cx='40' cy='40' r='3'/%3E%3Ccircle cx='20' cy='20' r='2'/%3E%3Ccircle cx='60' cy='60' r='2'/%3E%3Ccircle cx='10' cy='50' r='1.5'/%3E%3Ccircle cx='70' cy='30' r='1.5'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ===== MAIN CONTAINER CARD ===== */
    .register {
      border-radius: 24px !important;
      overflow: hidden;
      margin-top: 40px;
      margin-bottom: 40px;
      border: none !important;
      box-shadow: 0 25px 60px -15px rgba(15, 118, 110, 0.25), 0 0 0 1px rgba(15,118,110,0.05);
      position: relative;
      z-index: 1;
      animation: cardFadeIn 0.6s ease-out;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== LEFT SIDEBAR ===== */
    .register-left {
      background: linear-gradient(160deg, #064e3b 0%, #0f766e 45%, #0d9488 100%);
      color: white;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    /* Decorative circles */
    .register-left::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      pointer-events: none;
    }
    .register-left::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.06);
      pointer-events: none;
    }

    /* Logo circle */
    .register-left .logo-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      position: relative;
      z-index: 1;
    }
    .register-left .logo-circle img {
      width: 60px; height: 60px;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Sidebar title */
    .register-left h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      margin: 0;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .register-left h5 {
      font-weight: 500;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.75);
      margin: 0;
      position: relative;
      z-index: 1;
      line-height: 1.5;
    }

    /* Sidebar images row */
    .sidebar-imgs {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }
    .sidebar-imgs .img-box {
      width: 120px; height: 120px;
      border-radius: 16px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    .sidebar-imgs .img-box:hover {
      transform: translateY(-4px) scale(1.03);
    }
    .sidebar-imgs .img-box img {
      width: 90px; height: auto;
      object-fit: contain;
    }

    /* Sidebar badge */
    .sidebar-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(251,191,36,0.15);
      border: 1px solid rgba(251,191,36,0.3);
      color: #fcd34d;
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
      margin-top: 4px;
    }
    .sidebar-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(251,191,36,0); }
    }

    /* ===== RIGHT SIDE ===== */
    .register-right {
      padding: 36px 40px;
      background: #ffffff;
    }

    /* Header */
    .register-heading {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f1f5f4;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .register-heading .header-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(15,118,110,0.25);
      flex-shrink: 0;
    }
    .register-heading .header-icon i {
      font-size: 1.4rem;
      color: white;
    }
    .register-heading h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      color: var(--dark);
      font-size: 1.5rem;
      margin: 0;
      line-height: 1.2;
    }
    .register-heading .subtitle {
      font-size: 0.8rem;
      color: var(--gray);
      font-weight: 500;
      margin-top: 2px;
    }

    /* ===== FORM STYLES ===== */
    .register-form {
      row-gap: 8px;
    }

    /* Labels */
    .register-form label {
      font-weight: 600;
      color: #334155;
      font-size: 0.82rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .register-form label i {
      color: var(--secondary);
      font-size: 0.8rem;
      width: 16px;
      text-align: center;
    }

    /* Inputs */
    .register-form .form-control,
    .register-form .form-select {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      background: #f8fafc;
    }
    .register-form .form-control:hover,
    .register-form .form-select:hover {
      border-color: #cbd5e1;
    }
    .register-form .form-control:focus,
    .register-form .form-select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(20,184,166,0.1);
      background: #ffffff;
    }
    .register-form .form-control::placeholder {
      color: #cbd5e1;
    }

    /* Select2 override */
    .select2-container--bootstrap4 .select2-selection {
      border: 2px solid #e2e8f0 !important;
      border-radius: 12px !important;
      padding: 8px 12px !important;
      background: #f8fafc !important;
      min-height: 44px !important;
      transition: all 0.25s ease;
    }
    .select2-container--bootstrap4 .select2-selection:focus {
      border-color: var(--secondary) !important;
      box-shadow: 0 0 0 4px rgba(20,184,166,0.1) !important;
      background: #fff !important;
    }
    .select2-container--bootstrap4 .select2-selection--single .select2-selection__rendered {
      color: #334155 !important;
      font-size: 0.9rem !important;
      line-height: 1.5 !important;
    }

    /* Flatpickr override */
    .flatpickr-calendar {
      border-radius: 14px !important;
      border: none !important;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12) !important;
    }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
    }
    .flatpickr-day.today {
      border-color: var(--secondary) !important;
    }
    .flatpickr-day:hover {
      background: #f0fdfa !important;
      border-color: var(--secondary) !important;
    }
    .flatpickr-months .flatpickr-month,
    .flatpickr-current-month .flatpickr-monthDropdown-months {
      background: var(--primary) !important;
      color: white !important;
    }
    .flatpickr-current-month input.cur-year {
      color: white !important;
    }
    .flatpickr-weekday {
      color: var(--primary) !important;
      font-weight: 700 !important;
    }
    .flatpickr-prev-month, .flatpickr-next-month {
      color: white !important;
      fill: white !important;
    }

    /* ===== BUTTONS ===== */
    .btn-me {
      background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
      border: none !important;
      border-radius: 12px !important;
      padding: 12px 36px !important;
      font-weight: 700 !important;
      font-size: 0.9rem !important;
      letter-spacing: 0.5px;
      transition: all 0.3s ease !important;
      box-shadow: 0 6px 20px rgba(15,118,110,0.25) !important;
      display: inline-flex !important;
      align-items: center;
      gap: 8px;
    }
    .btn-me:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 28px rgba(15,118,110,0.35) !important;
    }
    .btn-me:active {
      transform: translateY(0) !important;
    }
    .btn-me.btn-loading {
      background: linear-gradient(135deg, #94a3b8, #64748b) !important;
    }

    /* ===== ALERT BOX ===== */
    .alert-success {
      border: none !important;
      border-radius: 14px !important;
      background: linear-gradient(135deg, #d1fae5, #a7f3d0) !important;
      color: #065f46 !important;
      padding: 16px 20px !important;
      border-left: 5px solid #10b981 !important;
      font-weight: 600;
    }
    .alert-success svg {
      color: #059669;
    }

    /* ===== FOOTER ===== */
    footer {
      position: relative;
      z-index: 1;
    }
    footer .text-muted {
      color: #94a3b8 !important;
      font-size: 0.82rem;
    }
    footer .nav a {
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 10px;
      background: #f1f5f4;
      color: var(--primary) !important;
    }
    footer .nav a:hover {
      background: var(--primary);
      color: white !important;
      transform: translateY(-2px);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 767.98px) {
      .register-left {
        padding: 30px 20px;
      }
      .register-right {
        padding: 24px 20px;
      }
      .register-heading h2 {
        font-size: 1.25rem;
      }
      .register-heading .header-icon {
        width: 44px; height: 44px;
      }
      .register-heading .header-icon i {
        font-size: 1.1rem;
      }
      .sidebar-imgs .img-box {
        width: 100px; height: 100px;
      }
      .sidebar-imgs .img-box img {
        width: 75px;
      }
    }

    /* ===== DECORATIVE TOP BAR ===== */
    .top-bar {
      height: 4px;
      background: linear-gradient(to right, var(--primary), var(--accent), var(--secondary));
      width: 100%;
      position: fixed;
      top: 0; left: 0;
      z-index: 1030;
    }
  </style>
</head>
<body>

  <!-- Top decorative bar -->
  <div class="top-bar"></div>

  <!-- ===== MAIN CARD ===== -->
  <div class="container register shadow">
    <div class="row g-0">

      <!-- ===== LEFT SIDEBAR ===== -->
      <div class="col-md-3 register-left">
        <div class="logo-circle">
          <img src="pkmlogo.png" alt="Puskesmas Trenggalek">
        </div>
        <h3>INOVASI<br>AGEN KRIBO</h3>
        <h5>Aksi Gencar<br>Skrining Tuberculosis</h5>
        <div class="sidebar-badge">
          <span class="dot"></span>
          SKRINING TBC
        </div>
        <div class="sidebar-imgs">
          <div class="img-box">
            <img src="kribo.png" alt="Kribo">
          </div>
          <div class="img-box">
            <img src="gg.png" alt="Gerobak">
          </div>
        </div>
      </div>

      <!-- ===== RIGHT FORM SIDE ===== -->
      <div class="col-md-9 register-right">
        <div class="tab-content" id="myTabContent">
          <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">

            <!-- Header -->
            <div class="register-heading">
              <div class="header-icon">
                <i class="fa-solid fa-lungs-virus"></i>
              </div>
              <div>
                <h2>Data Suspect TBC</h2>
                <div class="subtitle">Formulir Skrining Tuberculosis</div>
              </div>
            </div>

            <!-- Form -->
            <form name="submit-to-google-sheet">

              <!-- SVG icons for alert -->
              <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
                <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </symbol>
              </svg>

              <!-- Success Alert -->
              <div class="alert alert-success d-flex align-items-center shadow-sm d-none mb-3" role="alert">
                <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Success:"><use xlink:href="#check-circle-fill"/></svg>
                <div>Terimakasih, Data Berhasil Disimpan</div>
              </div>

              <div class="row register-form">

                <!-- Faskes -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-hospital"></i> Pilih Jaringan Pelayanan</label>
                  <select name="faskes" id="faskes" class="form-select select2" required>
                    <option value="">-- Pilih Jaringan Pelayanan --</option>
                    <option value="Apotik">Apotik</option>
                    <option value="Klinik DPM">Klinik DPM</option>
                    <option value="Toko Obat">Toko Obat</option>
                    <option value="Penyehat Tradisional">Penyehat Tradisional</option>
                    <option value="Kader">Kader</option>
                  </select>
                </div>

                <!-- Tanggal -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-calendar-days"></i> Tanggal</label>
                  <input type="text" id="tanggal" class="form-control" name="tanggal" placeholder="Pilih tanggal" required />
                </div>

                <!-- Nama -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-user"></i> Nama</label>
                  <input type="text" class="form-control" name="nama" placeholder="Masukkan nama lengkap" required/>
                </div>

                <!-- NIK -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-id-card"></i> NIK</label>
                  <input type="text" class="form-control" id="nik" name="nik" placeholder="Masukkan NIK" required/>
                </div>

                <!-- No Telp -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-phone"></i> No Telp</label>
                  <input type="text" id="no_telp" name="no_telp" class="form-control" placeholder="Masukkan nomor telepon" maxlength="13">
                </div>

                <!-- Provinsi -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-location-dot"></i> Provinsi</label>
                  <select id="provinsi" class="form-select select2" name="provinsi" required>
                    <option value="">Pilih Provinsi</option>
                  </select>
                </div>

                <!-- Kabupaten -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-map"></i> Kabupaten/Kota</label>
                  <select id="kabupaten" class="form-select select2" name="kabupaten" required>
                    <option value="">Pilih Kabupaten/Kota</option>
                  </select>
                </div>

                <!-- Kecamatan -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-map-location-dot"></i> Kecamatan</label>
                  <select id="kecamatan" class="form-select select2" name="kecamatan" required>
                    <option value="">Pilih Kecamatan</option>
                  </select>
                </div>

                <!-- Desa -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-place-of-worship"></i> Desa/Kelurahan</label>
                  <select id="desa" class="form-select select2" required>
                    <option value="">Pilih Desa/Kelurahan</option>
                  </select>
                  <input type="hidden" name="kelurahan" id="desa_nama">
                </div>

                <!-- RT -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-signs-post"></i> RT</label>
                  <input type="text" id="rt" class="form-control" placeholder="Masukkan RT" name="rt" required />
                </div>

                <!-- RW -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-signs-post"></i> RW</label>
                  <input type="text" id="rw" class="form-control" placeholder="Masukkan RW" name="rw" required />
                </div>

                <!-- Lama Batuk -->
                <div class="col-md-6 mt-2">
                  <label><i class="fa-solid fa-cough"></i> Lama Batuk</label>
                  <input type="text" class="form-control" name="lama_batuk" placeholder="Contoh: 2 minggu" required/>
                </div>

                <!-- Submit -->
                <div class="col-md-12 mt-4">
                  <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-me shadow btn-kirim text-white">
                      <i class="fa-solid fa-paper-plane me-1"></i> Simpan Data
                    </button>
                    <button class="btn btn-me shadow btn-loading d-none text-white" type="button" disabled>
                      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                      Loading...
                    </button>
                  </div>
                </div>

              </div>
            </form>

          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="container">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
      <div class="col-md-4 d-flex align-items-center">
        <a href="/" class="mb-3 me-2 mb-md-0 text-muted text-decoration-none lh-1"></a>
        <span class="text-muted">&copy; 2025 Puskesmas Trenggalek</span>
      </div>
      <ul class="nav col-md-4 justify-content-end list-unstyled d-flex gap-2">
        <li class="ms-2">

  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <script>
    $(document).ready(function () {
      $('.select2').select2({
        theme: 'bootstrap4',
        width: '100%',
        allowClear: true,
      });

      $('#no_telp').on('keyup', function () {
        let val = $(this).val().replace(/[^0-9]/g, '');
        if (val.length > 13) {
          val = val.substring(0, 13);
        }
        if (!val.startsWith('0') && val.length > 0) {
          val = '0' + val;
        }
        $(this).val(val);
      });

      async function fetchData(url) {
        const response = await fetch(url);
        return response.json();
      }

      async function loadProvinsi() {
        const provinsiSelect = $('#provinsi');
        const data = await fetchData('https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json');
        data.forEach(prov => {
          provinsiSelect.append(`<option value="${prov.id}" data-name="${prov.name}">${prov.name}</option>`);
        });
        provinsiSelect.trigger('change');
      }

      $('#provinsi').on('change', async function () {
        const idProvinsi = $(this).val();
        const kabupatenSelect = $('#kabupaten');
        kabupatenSelect.empty().append('<option value="">Pilih Kabupaten/Kota</option>');
        if (idProvinsi) {
          const data = await fetchData(`https://www.emsifa.com/api-wilayah-indonesia/api/regencies/${idProvinsi}.json`);
          data.forEach(kab => {
            kabupatenSelect.append(`<option value="${kab.id}" data-name="${kab.name}">${kab.name}</option>`);
          });
          kabupatenSelect.trigger('change');
        }
      });

      $('#kabupaten').on('change', async function () {
        const idKabupaten = $(this).val();
        const kecamatanSelect = $('#kecamatan');
        kecamatanSelect.empty().append('<option value="">Pilih Kecamatan</option>');
        if (idKabupaten) {
          const data = await fetchData(`https://www.emsifa.com/api-wilayah-indonesia/api/districts/${idKabupaten}.json`);
          data.forEach(kec => {
            kecamatanSelect.append(`<option value="${kec.id}" data-name="${kec.name}">${kec.name}</option>`);
          });
          kecamatanSelect.trigger('change');
        }
      });

      $('#kecamatan').on('change', async function () {
        const idKecamatan = $(this).val();
        const desaSelect = $('#desa');
        desaSelect.empty().append('<option value="">Pilih Desa/Kelurahan</option>');
        if (idKecamatan) {
          const data = await fetchData(`https://www.emsifa.com/api-wilayah-indonesia/api/villages/${idKecamatan}.json`);
          data.forEach(desa => {
            desaSelect.append(`<option value="${desa.id}" data-name="${desa.name}">${desa.name}</option>`);
          });
          desaSelect.trigger('change');
        }
      });

      $('#desa').on('change', function () {
        const nameDesa = $(this).find(':selected').data('name');
        $('#desa_nama').val(nameDesa);
      });

      loadProvinsi();
    });

    // Flatpickr Datepicker
    $('#tanggal').flatpickr({
      dateFormat: 'Y-m-d',
      altInput: true,
      altFormat: 'd F Y',
      disableMobile: true
    });

    // Form Submit
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.forms['submit-to-google-sheet'];
      const alertBox = document.querySelector('.alert-success');
      const submitButton = document.querySelector('.btn-kirim');
      const loadingButton = document.querySelector('.btn-loading');

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitButton.classList.add('d-none');
        loadingButton.classList.remove('d-none');

        let nik = "'" + document.getElementById('nik').value;
        let no_telp = document.getElementById('no_telp').value;
        if (no_telp.startsWith('0')) {
          no_telp = "'" + no_telp;
        }

        let provinsi = $('#provinsi option:selected').data('name');
        let kabupaten = $('#kabupaten option:selected').data('name');
        let kecamatan = $('#kecamatan option:selected').data('name');
        let desa = $('#desa option:selected').data('name');

        const formData = new FormData(form);
        formData.append('nik', nik);
        formData.append('no_telp', no_telp);
        formData.append('provinsi', provinsi);
        formData.append('kabupaten', kabupaten);
        formData.append('kecamatan', kecamatan);
        formData.append('desa', desa);

        const jsonData = {};
        formData.forEach((value, key) => {
          jsonData[key] = value;
        });

        fetch('https://script.google.com/macros/s/AKfycbxeMNOb6KnATCyppjqP2rdH7AAMXR-BfKvtutXyi2IdhGGflC7Hi_1mfTqRIlEp6xV-/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(jsonData),
        })
        .then(() => {
          alertBox.classList.remove('d-none');
          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Data telah dikirim.',
            confirmButtonColor: '#0f766e',
            confirmButtonText: 'Oke',
          });
          form.reset();
          submitButton.classList.remove('d-none');
          loadingButton.classList.add('d-none');
          setTimeout(() => alertBox.classList.add('d-none'), 3000);
        })
        .catch(() => {
          Swal.fire({
            icon: 'error',
            title: 'Oops!',
            text: 'Terjadi kesalahan, coba lagi nanti.',
            confirmButtonColor: '#0f766e',
          });
          submitButton.classList.remove('d-none');
          loadingButton.classList.add('d-none');
        });
      });
    });
  </script>
